version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile-backend
    ports:
      - "5001:5001"
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:5001
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:5001
    env_file:
      - frontend/.env.local
    depends_on:
      - backend
    restart: unless-stopped
